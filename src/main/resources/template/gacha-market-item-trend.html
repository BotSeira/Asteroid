<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>市场行情</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            width: 1200px;
            padding: 36px;
            background: #0d1020;
            color: #f8fafc;
            font: 16px "Microsoft YaHei UI", sans-serif;
            font-variant-numeric: tabular-nums
        }

        .title {
            font-size: 40px;
            font-weight: 700;
            margin: 10px 0
        }

        .metric, .metric-value, .metric-label {
            text-align: center;
        }

        .metric {
            border-left: #394052 solid 1px;
            padding: 0 18px;
        }

        .chart-title {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 8px
        }

        .subtitle {
            color: #b0bbcf;
            font-size: 20px;
        }

        .metric-value {
            display: block;
            font-size: 27px;
            font-weight: 700;
            margin-top: 8px
        }

        .charts {
            display: grid;
            grid-template-columns:1fr 1fr;
            gap: 28px;
            margin-top: 28px
        }

        .chart {
            min-width: 0;
            border-bottom: 1px solid #394052;
            padding-bottom: 12px
        }

        .chart-canvas {
            width: 100%;
            height: 280px;
        }

        #empty {
            padding: 60px 0
        }

        .subtitle {
            margin: 16px 0;
        }
    </style>
</head>
<body>
<div style="border-bottom: 2px solid #f472b6; padding-bottom: 12px; display: flex; align-items: flex-end; gap: 20px;">
    <div class="title" th:text="${name}">铜回放</div>
    <div class="subtitle" th:text="'近' + ${scale}">近 3d</div>
    <div id="metrics"
         style="display: flex; align-items: end; margin-left: auto;"
         th:if="${summary != null}">
        <div class="metric">
            <div class="metric-label">上架数量</div>
            <div class="metric-value"
                 th:text="${summary.listed == null ? '—' : #numbers.formatDecimal(summary.listed, 1, 'COMMA', 0, 'POINT')}">
                1,234
            </div>
        </div>
        <div class="metric">
            <div class="metric-label">最低价</div>
            <div class="metric-value"
                 th:text="${summary.lowest == null ? '—' : #numbers.formatInteger(summary.lowest, 1, 'COMMA')}">
                12,345
            </div>
        </div>
        <div class="metric">
            <div class="metric-label">中位价</div>
            <div class="metric-value"
                 th:text="${summary.median == null ? '—' : #numbers.formatDecimal(summary.median, 1, 'COMMA', 0, 'POINT')}">
                12,345
            </div>
        </div>
        <div class="metric">
            <div class="metric-label">最高价</div>
            <div class="metric-value"
                 th:text="${summary.highest == null ? '—' : #numbers.formatInteger(summary.highest, 1, 'COMMA')}">
                12,345
            </div>
        </div>
        <div class="metric">
            <div class="metric-label" th:text="${summary.days} + '天成交笔数'">30 天成交</div>
            <div class="metric-value"
                 th:text="${summary.sales == null ? '—' : #numbers.formatDecimal(summary.sales, 1, 'COMMA', 0, 'POINT')}">
                1,234
            </div>
        </div>
    </div>
</div>

<div id="empty" th:if="${summary == null}">暂无数据</div>

<div class="charts" th:if="${summary != null}">
    <div class="chart">
        <div class="chart-title">价格走势</div>
        <div class="chart-canvas" id="prices"></div>
    </div>
    <div class="chart">
        <div class="chart-title">最低挂单价</div>
        <div th:if="${candleSamples == 0}">请扩大数据范围</div>
        <div class="chart-canvas" id="candles"></div>
    </div>
    <div class="chart">
        <div class="chart-title">挂单价格分布</div>
        <div class="chart-canvas" id="distribution"></div>
    </div>
    <div class="chart">
        <div class="chart-title" th:text="${summary.days} + '天成交笔数'">30 天成交笔数</div>
        <div class="chart-canvas" id="sales"></div>
    </div>
</div>
<!--suppress JSUnresolvedLibraryURL -->
<script src="http://asteroid-assets/echarts.js" th:if="${summary != null}"></script>
<!--suppress ThymeleafObsoleteInlineAttributeInspection -->
<script th:if="${summary != null}" th:inline="javascript">
    const data = JSON.parse(/*[[${chartData}]]*/ '{}');
</script>
<!--suppress ThymeleafObsoleteInlineAttributeInspection -->
<script th:if="${summary != null}" th:inline="none">
    const timeAxis = {
        type: 'time', min: data.rangeStart, max: data.rangeEnd, splitNumber: 5,
        axisLabel: {formatter: '{MM}-{dd}\n{HH}:{mm}', hideOverlap: true}
    };
    const lineStyle = {type: 'line', connectNulls: false, symbolSize: 3};
    const emptyTitle = text => ({text, left: 'center', top: 'middle', textStyle: {color: '#b0bbcf', fontSize: 14}});
    const options = {
        prices: {
            title: data.hasPrices ? undefined : emptyTitle('暂无有效价格'),
            legend: {textStyle: {color: '#b0bbcf'}},
            xAxis: timeAxis,
            yAxis: {type: 'log', scale: true},
            series: [
                {...lineStyle, name: '最低价', data: data.lowest},
                {...lineStyle, name: '中位价', data: data.median},
                {...lineStyle, name: '最高价', data: data.highest}
            ]
        },
        candles: {
            xAxis: timeAxis,
            yAxis: {type: 'value', min: data.candleMin, max: data.candleMax},
            series: [{
                type: 'candlestick', data: data.candles, dimensions: ['TIME', 'OPEN', 'HIGH', 'LOW', 'CLOSE'], encode: {x: 0, y: [1, 4, 3, 2]}, barMaxWidth: 30,
                itemStyle: {color: '#60a5fa', color0: '#f472b6', borderColor: '#60a5fa', borderColor0: '#f472b6'}
            }]
        },
        distribution: {
            title: data.distribution.length ? undefined : emptyTitle('暂无有效数据'),
            xAxis: {
                type: 'value', name: '单价', nameLocation: 'middle', nameGap: 22,
                min: extent => Number.isFinite(extent.min) ? Math.max(0, extent.min - 1) : 0
            },
            yAxis: {type: 'value', name: '数量'},
            series: [{type: 'bar', data: data.distribution, barMaxWidth: 16}]
        },
        sales: {
            title: data.sales.length ? undefined : emptyTitle('暂无有效数据'),
            xAxis: {type: 'time', axisLabel: {formatter: '{MM}-{dd}\n{HH}:{mm}'}},
            yAxis: {type: 'value'},
            series: [{...lineStyle, data: data.sales}]
        }
    };
    for (const [id, option] of Object.entries(options)) {
        const container = document.getElementById(id);
        if (!container) continue;
        echarts.init(container, null, {renderer: 'svg'}).setOption({
            animation: false, useUTC: true,
            textStyle: {color: '#b0bbcf'}, color: ['#60a5fa', '#f472b6', '#fbbf24'],
            grid: {left: 12, right: 24, top: 40, bottom: 28, containLabel: true},
            ...option,
            yAxis: {...option.yAxis, splitLine: {lineStyle: {color: '#293044'}}}
        });
    }
</script>
</body>
</html>
