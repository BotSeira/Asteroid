<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>市场行情</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            width: 1200px;
            padding: 36px;
            background: #0d1020;
            color: #f8fafc;
            font: 16px "Microsoft YaHei UI", sans-serif;
            font-variant-numeric: tabular-nums
        }

        .title {
            font-size: 48px;
            font-weight: 700;
            margin: 10px 0
        }

        .metric, .metric-value, .metric-label {
            text-align: center;
        }

        .metric {
            border-left: #394052 solid 1px;
            padding: 0 18px;
        }

        .chart-title {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 8px
        }

        .chart-legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-legend-color {
            width: 16px;
            height: 16px;
        }


        .subtitle {
            color: #b0bbcf;
            font-size: 28px;
        }

        .metric-value {
            display: block;
            font-size: 27px;
            font-weight: 700;
            margin-top: 8px
        }

        .charts {
            display: grid;
            grid-template-columns:1fr 1fr;
            gap: 28px;
            margin-top: 28px
        }

        .chart {
            min-width: 0;
            border-bottom: 1px solid #394052;
            padding-bottom: 12px
        }

        .chart-canvas {
            width: 100%;
            height: 300px;
        }

        #empty {
            padding: 60px 0
        }

        .subtitle {
            margin: 16px 0;
        }
    </style>
</head>
<body>
<div style="border-bottom: 2px solid #f472b6; padding-bottom: 12px; display: flex; align-items: flex-end; gap: 12px;">
    <div class="title" th:text="${name}">铜回放</div>
    <div class="subtitle" th:text="${type}">物品</div>
    <div class="subtitle">·</div>
    <div class="subtitle" th:text="'近' + ${scale}">近 3d</div>
    <div id="metrics"
         style="display: flex; align-items: end; margin-left: auto;"
         th:if="${summary != null}">
        <div class="metric">
            <div class="metric-label">上架数量</div>
            <div class="metric-value"
                 th:text="${summary.listed == null ? '—' : #numbers.formatDecimal(summary.listed, 1, 'COMMA', 0, 'POINT')}">
                1,234
            </div>
        </div>
        <div class="metric">
            <div class="metric-label">最低价</div>
            <div class="metric-value"
                 th:text="${summary.lowest == null ? '—' : #numbers.formatInteger(summary.lowest, 1, 'COMMA')}">
                12,345
            </div>
        </div>
        <div class="metric">
            <div class="metric-label">中位价</div>
            <div class="metric-value"
                 th:text="${summary.median == null ? '—' : #numbers.formatDecimal(summary.median, 1, 'COMMA', 0, 'POINT')}">
                12,345
            </div>
        </div>
        <div class="metric">
            <div class="metric-label">最高价</div>
            <div class="metric-value"
                 th:text="${summary.highest == null ? '—' : #numbers.formatInteger(summary.highest, 1, 'COMMA')}">
                12,345
            </div>
        </div>
        <div class="metric">
            <div class="metric-label" th:text="${summary.days} + '天成交'">30 天成交</div>
            <div class="metric-value"
                 th:text="${summary.sales == null ? '—' : #numbers.formatDecimal(summary.sales, 1, 'COMMA', 0, 'POINT')}">
                1,234
            </div>
        </div>
    </div>
</div>

<div id="empty" th:if="${summary == null}">暂无数据</div>

<div class="charts" th:if="${summary != null}">
    <div class="chart">
        <div style="display: flex; gap: 24px;">
            <div class="chart-title">价格走势</div>
            <div class="chart-legend" style="display: flex; gap: 24px; margin-left: auto; margin-right: 24px;">
                <div class="chart-legend-item">
                    <div class="chart-legend-color" style="background-color: #60a5fa;"></div>
                    <div class="chart-legend-label">最低价</div>
                </div>
                <div class="chart-legend-item">
                    <div class="chart-legend-color" style="background-color: #f472b6;"></div>
                    <div class="chart-legend-label">中位价</div>
                </div>
                <div class="chart-legend-item">
                    <div class="chart-legend-color" style="background-color: #fbbf24;"></div>
                    <div class="chart-legend-label">最高价</div>
                </div>
            </div>
        </div>
        <div class="chart-canvas" id="prices"></div>
    </div>
    <div class="chart">
        <div style="display: flex; gap: 24px;">
            <div class="chart-title">最低挂单价</div>
            <div class="chart-legend" style="display: flex; gap: 24px; margin-left: auto; margin-right: 24px;">
                <div class="chart-legend-item">
                    <div class="chart-legend-color" style="background-color: #60a5fa;"></div>
                    <div class="chart-legend-label">涨</div>
                </div>
                <div class="chart-legend-item">
                    <div class="chart-legend-color" style="background-color: #f472b6;"></div>
                    <div class="chart-legend-label">跌</div>
                </div>
            </div>
        </div>
        <div th:if="${candleSamples == 0}">请扩大数据范围</div>
        <div class="chart-canvas" id="candles"></div>
    </div>
    <div class="chart">
        <div class="chart-title">挂单价格分布</div>
        <div class="chart-canvas" id="distribution"></div>
    </div>
    <div class="chart">
        <div class="chart-title" th:text="${summary.days} + '天成交笔数'">30 天成交笔数</div>
        <div class="chart-canvas" id="sales"></div>
    </div>
</div>

<script th:if="${summary != null}" th:inline="none">
    const timeAxis = {
        type: 'time',
        min: data.rangeStart,
        max: data.rangeEnd,
        splitNumber: 10,
        axisLabel: {formatter: '{MM}-{dd}\n{HH}:{mm}', hideOverlap: true},
        splitLine: {show: true, lineStyle: {color: '#293044'}}
    };
    const lineStyle = {type: 'line', connectNulls: false, symbolSize: 3};
    const emptyTitle = text => ({text, left: 'center', top: 'middle', textStyle: {color: '#b0bbcf', fontSize: 14}});
    const options = {
        prices: {
            title: data.hasPrices ? undefined : emptyTitle('暂无有效价格'),
            legend: {show: false},
            xAxis: {
                ...timeAxis,
                splitNumber: 8,
                axisTick: {
                    show: true
                },
                splitLine: {
                    show: true,
                    lineStyle: {color: '#293044'}
                }
            },
            yAxis: {
                type: 'log',
                logBase: 2,
                splitNumber: 8,
                axisLabel: {
                    show: true,
                    hideOverlap: true
                },
                scale: true,
                min: (extent => Number.isFinite(extent.min) && extent.min > 0
                    ? Math.max(Number.MIN_VALUE, extent.min * 0.95)
                    : 1),
                minorTick: {
                    show: true,
                    splitNumber: 2
                },
                minorSplitLine: {
                    show: true,
                    lineStyle: {color: '#202638'}
                },
                name: '价格'
            },
            series: [
                {...lineStyle, name: '最低价', data: data.lowest},
                {...lineStyle, name: '中位价', data: data.median},
                {...lineStyle, name: '最高价', data: data.highest}
            ]
        },
        candles: {
            xAxis: timeAxis,
            yAxis: {
                type: 'value',
                min: data.candleMin,
                max: data.candleMax,
                name: '最低挂单价',
                splitNumber: 8,
            },
            series: [{
                type: 'candlestick',
                data: data.candles,
                dimensions: ['TIME', 'OPEN', 'HIGH', 'LOW', 'CLOSE'],
                encode: {x: 0, y: [1, 4, 3, 2]},
                barWidth: 15,
                barMaxWidth: 18,
                itemStyle: {color: '#60a5fa', color0: '#f472b6', borderColor: '#60a5fa', borderColor0: '#f472b6'}
